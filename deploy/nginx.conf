# =============================================================================
# FocusKids — Nginx + Let's Encrypt (producción real sin ngrok)
# Reemplazar "focuskids.example.com" con el dominio real antes de usar.
# =============================================================================

# CA-03: redirigir TODO el tráfico HTTP → HTTPS (código 301 permanente)
server {
    listen 80;
    listen [::]:80;
    server_name focuskids.example.com;

    # Solo se permite este path para que Certbot pueda renovar sin HTTPS
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# CA-02 + CA-04 + CA-05: servidor HTTPS con TLS 1.2/1.3 y headers de seguridad
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name focuskids.example.com;

    # ── CA-01: certificados Let's Encrypt (Certbot los pone aquí) ────────────
    ssl_certificate     /etc/letsencrypt/live/focuskids.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/focuskids.example.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/focuskids.example.com/chain.pem;

    # ── CA-02: solo TLS 1.2 y 1.3; 1.0 y 1.1 rechazados explícitamente ──────
    ssl_protocols TLSv1.2 TLSv1.3;

    # Ciphers seguros (perfil Mozilla Intermediate — SSL Labs A)
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Mejora de rendimiento TLS
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling (CA-05: requerido para A+)
    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout    5s;

    # ── CA-04: HSTS — max-age 1 año + includeSubDomains ─────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ── Encabezados de seguridad adicionales (CA-05: SSL Labs los evalúa) ────
    add_header X-Frame-Options           "DENY"                              always;
    add_header X-Content-Type-Options    "nosniff"                           always;
    add_header X-XSS-Protection          "1; mode=block"                     always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"   always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

    # ── API: proxy al Spring Boot (puerto 8080) ───────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── Frontend Angular (archivos estáticos) ────────────────────────────────
    location / {
        root  /var/www/focuskids;
        index index.html;
        try_files $uri $uri/ /index.html;   # necesario para el router de Angular

        # Cache de assets con hash (Angular los genera con nombre único)
        location ~* \.(js|css|png|jpg|gif|svg|woff2|ico)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
